function photoHead(F,mood,t,o){const w=F.w,h=F.h,r=Math.sin(t*12)*.025*(mood=='laugh'?3:1);
X.save();X.translate(0,-40);X.rotate(r);X.scale(1,mood=='shock'?1.06:1);X.translate(0,40);
X.drawImage(F.img,-w/2,F.by-h,w,h);
const mx=-w/2+w*F.mx,my=F.by-h+h*F.my;
if(mood=='laugh'){X.fillStyle='#5a0e14';X.beginPath();X.ellipse(mx,my+1,8,6.5,0,0,PI);X.fill();X.fillStyle='#fff';X.fillRect(mx-6,my+.5,12,2.4);X.fillStyle='#e8707a';X.beginPath();X.ellipse(mx,my+5,4,2,0,0,7);X.fill()}
else if(mood=='shock'){X.fillStyle='#5a0e14';X.beginPath();X.ellipse(mx,my+2,4.5,6,0,0,7);X.fill()}
else if(mood=='angry'){X.fillStyle='#5a0e14';X.beginPath();X.ellipse(mx,my+1,7,4.5+Math.abs(Math.sin(t*14))*3.5,0,0,7);X.fill();X.fillStyle='#fff';X.fillRect(mx-5,my-3,10,2.2)}
if(F.acc&&o){if(o.scarf){X.fillStyle=o.scarf;X.beginPath();X.moveTo(-26,-58);X.bezierCurveTo(-31,-112,31,-112,26,-58);X.lineTo(20,-62);X.quadraticCurveTo(0,-86,-20,-62);X.closePath();X.fill()}

X.restore()}

/* ===== PERSON RENDERER (used for every human) ===== */
function person(x,y,o){
const s=o.s||1,st=o.st||'run',t=o.t||0,ph=t*(o.rate||12),sw=Math.sin(ph);
let la=0,lb=0,aa=.12,ab=-.12,rot=0,lift=0,mood=o.mood||'smile',hy=-34;
if(st=='run'){la=sw*.9;lb=-la;aa=-sw;ab=sw;lift=Math.abs(Math.cos(ph))*3.5}
else if(st=='jump'){la=.8;lb=-.5;aa=-2.5;ab=2.5;mood='shock'}
else if(st=='slide'){rot=-1.2;hy=-16;la=1.3;lb=1.1;aa=1.4;ab=1.4;mood='laugh'}
else if(st=='hit'){rot=Math.sin(t*40)*.18;aa=-1.9;ab=1.9;la=.4;lb=-.4;mood='shock'}
else if(st=='fall'){rot=1.45;hy=-16;la=-.4;lb=.3;aa=2.4;ab=2.9;mood='dizzy'}
else if(st=='celebrate'){aa=-2.6+Math.sin(t*14)*.3;ab=2.6-Math.sin(t*14)*.3;lift=Math.abs(Math.sin(t*7))*16;mood='laugh'}
else if(st=='laugh'){rot=Math.sin(t*28)*.06;aa=.5;ab=-.5;mood='laugh';lift=Math.abs(Math.sin(t*14))*3}
else lift=Math.sin(t*3)*1.2; // idle
X.save();X.translate(x,y-lift*s);X.scale(s*(o.dir||1),s);X.translate(0,hy);X.rotate(rot);X.lineCap='round';
// legs, pants cuffs and sandals
const leg=(hx,a)=>{const fx=hx+Math.sin(a)*34,fy=Math.cos(a)*34;X.strokeStyle=o.pants;X.lineWidth=15;X.beginPath();X.moveTo(hx,0);X.lineTo(fx,fy);X.stroke();
if(o.cuff){X.strokeStyle=o.cuff;X.lineWidth=16;X.lineCap='butt';X.beginPath();X.moveTo(hx+Math.sin(a)*24,Math.cos(a)*24);X.lineTo(fx,fy-1);X.stroke();X.lineCap='round'}
X.fillStyle=o.skin;X.beginPath();X.ellipse(fx+4,fy+1,7,3.5,0,0,7);X.fill();X.fillStyle=o.shoe;X.beginPath();X.ellipse(fx+4,fy+4,12,3.6,a*.3,0,7);X.fill();X.strokeStyle=o.shoe;X.lineWidth=2.5;X.beginPath();X.moveTo(fx-2,fy);X.lineTo(fx+9,fy);X.stroke()};
leg(-9,la);leg(9,lb);
// torso
const bw=o.belly?27:21;
X.fillStyle=o.skin;X.fillRect(-7,-50,14,14);
X.fillStyle=o.shirt;X.strokeStyle='rgba(0,0,0,.2)';X.lineWidth=2;X.beginPath();X.ellipse(0,-20,bw,27,0,0,7);X.fill();X.stroke();
X.save();X.clip();
if(o.pat){X.fillStyle='#6f80ba';for(let j=0;j<6;j++)for(let i=-3;i<=3;i++){const px=i*10+(j%2)*5,py=-44+j*10;X.beginPath();X.moveTo(px,py-2.6);X.lineTo(px+2,py);X.lineTo(px,py+2.6);X.lineTo(px-2,py);X.fill()}}
if(o.apron){X.fillStyle=o.apron;X.fillRect(-17,-32,34,40);X.fillStyle='#c97f10';X.fillRect(-17,-32,34,3)}
X.restore();
if(o.pat||o.hat){X.fillStyle='#fff';X.strokeStyle='#bbb';X.lineWidth=1.5;for(const sd of[-1,1]){X.beginPath();X.moveTo(sd*14,-47);X.lineTo(sd*1,-34);X.lineTo(sd*3,-51);X.closePath();X.fill();X.stroke()}}
if(o.pat){X.strokeStyle='#ccc';X.beginPath();X.moveTo(0,-35);X.lineTo(0,-22);X.stroke();circ(0,-31,1.5,'#aaa');circ(0,-25,1.5,'#aaa')}
if(o.pocket){X.strokeStyle='#aab';X.lineWidth=1.8;X.strokeRect(9,-30,11,12)}
// arms
const arm=(sx,a,hand)=>{const mx=sx+Math.sin(a)*13,my=-34+Math.cos(a)*13,hx=sx+Math.sin(a)*30,hy2=-34+Math.cos(a)*30;
X.strokeStyle=o.shirt;X.lineWidth=15;X.beginPath();X.moveTo(sx,-34);X.lineTo(mx,my);X.stroke();
X.strokeStyle=o.skin;X.lineWidth=10;X.beginPath();X.lineTo(mx,my);X.moveTo(mx,my);X.lineTo(hx,hy2);X.stroke();circ(hx,hy2,5.5,o.skin);
if(hand&&o.hold)sam(X,hx+5,hy2-6,.65);
if(hand&&o.ladle){X.strokeStyle='#5a3a1a';X.lineWidth=4;X.beginPath();X.moveTo(hx,hy2);X.lineTo(hx+14,hy2-34);X.stroke();X.fillStyle='#999';X.beginPath();X.ellipse(hx+16,hy2-40,10,7,.4,0,7);X.fill()}};

X.fillStyle='rgba(120,50,20,.25)';X.beginPath();X.ellipse(0,-59.5,3.5,2.5,0,0,7);X.fill();
for(const sd of[-1,1]){const ex=sd*7.5,ey=-66;

Z.sl-=dt;g.inv-=dt;g.hitT-=dt;g.cel-=dt;g.shake=Math.max(0,g.shake-dt);

if(Z.y==0&&Z.sl<=0){g.stepT-=d;if(g.stepT<=0){g.stepT=.3*380/g.sp;SFX.step()}g.dustT-=d;if(g.dustT<=0){g.dustT=.1;G.fx.push({x:Z.x-12,y:GY,vx:-90,vy:-25,l:.4,c:'#d9c3a0',r:3,g:0})}}
// spawn & move
g.nx-=g.sp*d;if(g.nx<=0)spawn();
for(const o of g.obs){o.x-=(g.sp+o.ev)*d;if(!o.dead&&hitBox(o))hurt(o)}
g.obs=g.obs.filter(o=>o.x>-160&&!o.dead);
for(const it of g.its){it.x-=g.sp*d;if(g.pw.mag>0&&(it.k=='coin'||it.k=='sam')&&Math.abs(it.x-Z.x)<300){it.x+=(Z.x-it.x)*6*dt;it.y+=(Z.y+45-it.y)*6*dt}
if(Math.abs(it.x-Z.x)<30&&it.y>Z.y-10&&it.y<Z.y+(Z.sl>0?52:112)){it.got=1;take(it)}}
g.its=g.its.filter(i=>i.x>-60&&!i.got);
// milestones
if(g.dist/500>=g.ms+1){g.ms++;g.cel=1.3;SFX.win();g.toast={t:2.4,txt:(g.ms*500)+'m! '+MILE[(g.ms-1)%MILE.length]};g.lives=Math.min(5,g.lives+(g.ms%2?0:1))}
// speech
g.bubT-=dt;if(g.bubT<=0){g.bubT=R(3.5,6);const z=Math.random()<.25;say(z?'z':'d',pick(z?SAY_Z:SAY_D));if(!z)SFX.shout()}
if(g.bub&&(g.bub.t-=dt)<=0)g.bub=null;
if(g.toast&&(g.toast.t-=dt)<=0)g.toast=null;
bgLife(d,g.sp);updFx(dt);
g.score=Math.floor(g.dist)+g.sam*50+g.coin*10}
function updFx(dt){for(const f of G.fx){f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.g)f.vy+=500*dt;f.l-=dt*(f.t?.7:1)}G.fx=G.fx.filter(f=>f.l>0)}
function updOver(dt){const g=G;g.t+=dt;g.ot+=dt;g.sp*=.92;bgx+=g.sp*dt;g.gap=Math.max(40,g.gap-90*dt);g.sp=Math.max(0,g.sp);updFx(dt);bgLife(dt,g.sp);
if(g.ot>1.4&&!shown){shown=true;rec=g.score>best;if(rec){best=g.score;store.set(best);SFX.win()}
$('ot').textContent=pick(OVERS);$('os').innerHTML='স্কোর: <b>'+g.score+'</b> · '+Math.floor(g.dist)+'m · 🥟 '+g.sam+' · 🪙 '+g.coin+'<br>'+(rec?'🏆 নতুন রেকর্ড! ':'')+'সেরা: <b>'+best+'</b>';ov('over')}}
function updDemo(dt){G.t+=dt;bgx+=150*dt;bgLife(dt,150)}

/* ===== DRAW ===== */
function drawWorld(){
X.save();if(G.shake>0)X.translate(R(-5,5)*G.shake*3,R(-4,4)*G.shake*3);

X.fillStyle='#f5f0c8';const o=bgx%140;for(let x=-o;x<W;x+=140)X.fillRect(x,506,70,7);

if(it.k=='coin'){X.fillStyle='#ffd23f';X.strokeStyle='#c98a00';X.lineWidth=2;X.beginPath();X.ellipse(0,0,Math.abs(Math.cos(G.t*5+it.x*.1))*11+3,13,0,0,7);X.fill();X.stroke()}
else if(it.k=='sam'){X.fillStyle='rgba(255,183,3,.35)';X.beginPath();X.arc(0,0,21,0,7);X.fill();sam(X,0,0,1.25)}
else{X.fillStyle='rgba(255,255,255,.85)';X.beginPath();X.arc(0,0,21,0,7);X.fill();X.strokeStyle=PW[it.k].c;X.lineWidth=4;X.stroke();emo(PW[it.k].e,0,13,24)}
X.restore()}
// chaser & player
const dx=Z.x-G.gap,over=S=='over',ph=Z.y>0?1:0;
X.fillStyle='rgba(0,0,0,.28)';X.beginPath();X.ellipse(dx,GY+3,30,7,0,0,7);X.fill();X.beginPath();X.ellipse(Z.x,GY+3,30-Z.y*.08,7,0,0,7);X.fill();
person(dx,GY,{...DOK,st:over&&G.ot>.6?'laugh':'run',t:G.t*1.05,rate:11,mood:over?'laugh':'angry'});
if(G.pw.shd>0||G.inv>0&&Math.floor(G.t*14)%2==0&&!over){}
let zs=over?'fall':G.hitT>0?'hit':Z.y>0?'jump':Z.sl>0?'slide':G.cel>0?'celebrate':'run';
if(!(G.inv>0&&zs=='run'&&Math.floor(G.t*16)%2==0)||G.pw.shd>0){
if(G.pw.shd>0){X.strokeStyle='rgba(76,201,240,.8)';X.lineWidth=4;X.fillStyle='rgba(76,201,240,.18)';X.beginPath();X.arc(Z.x,GY-Z.y-50,66,0,7);X.fill();X.stroke()}
if(G.pw.spd>0){X.fillStyle='rgba(255,210,63,.6)';for(let i=0;i<4;i++)X.fillRect(Z.x-100-i*30,GY-Z.y-20-i*18,70,4)}
person(Z.x,GY-Z.y,{...ZAR,hold:1,st:zs,t:G.t,rate:12+G.sp/90,mood:zs=='run'||zs=='celebrate'?'smile':undefined})}
if(G.pw.mag>0){X.strokeStyle='rgba(239,71,111,.35)';X.setLineDash([6,8]);X.beginPath();X.arc(Z.x,GY-Z.y-50,120,0,7);X.stroke();X.setLineDash([])}
// fx
for(const f of G.fx){if(f.t){X.globalAlpha=Math.min(1,f.l*1.5);X.font='bold 22px "Trebuchet MS"';X.textAlign='center';X.textBaseline='alphabetic';X.lineWidth=4;X.strokeStyle='#3a1c00';const hw=X.measureText(f.t).width/2+10,fx=cl(f.x,hw,W-hw),fy=Math.max(f.y,40);X.strokeText(f.t,fx,fy);X.fillStyle=f.c;X.fillText(f.t,fx,fy)}else{X.globalAlpha=Math.min(1,f.l*2);circ(f.x,f.y,f.r,f.c)}X.globalAlpha=1}
// speech bubble
if(G.bub&&S=='play'){const b=G.bub,hx=b.who=='d'?dx:Z.x;let fs=18,m;
// text is left-aligned and centred by hand (no textAlign/maxWidth), so box and text always use the same measured width
X.textAlign='left';X.textBaseline='alphabetic';
for(;;){X.font='bold '+fs+'px "Trebuchet MS"';m=X.measureText(b.txt);if(m.width<=W-80||fs<=11)break;fs--}
const tw=m.width,asc=m.actualBoundingBoxAscent||fs,des=m.actualBoundingBoxDescent||fs/3,w=tw+44,h=asc+des+24,by=b.who=='z'?Math.min(GY-150,GY-Z.y-132):GY-150,cx=cl(hx+(b.who=='d'?w/3:0),w/2+10,W-w/2-10),tx=cl(hx,cx-w/2+16,cx+w/2-16);
X.fillStyle='#fff';X.strokeStyle='#3a1c00';X.lineWidth=3;X.beginPath();X.roundRect(cx-w/2,by-h,w,h,12);X.fill();X.stroke();
X.beginPath();X.moveTo(tx-7,by-1);X.lineTo(tx,by+14);X.lineTo(tx+8,by-1);X.fill();
X.fillStyle='#3a1c00';X.fillText(b.txt,cx-tw/2,by-h+12+asc)}
X.restore()}
function bar(x,y,w,h,r,c){X.fillStyle='rgba(0,0,0,.45)';X.fillRect(x,y,w,h);X.fillStyle=c;X.fillRect(x,y,w*cl(r,0,1),h)}
function hud(){const g=G;X.fillStyle='rgba(30,14,4,.62)';X.beginPath();X.roundRect(10,10,830,50,14);X.fill();
X.textBaseline='middle';X.textAlign='left';X.font='25px serif';for(let i=0;i<g.lives;i++)X.fillText('❤️',20+i*29,36);
X.fillStyle='#fff';X.font='bold 25px "Trebuchet MS"';X.fillText('স্কোর '+g.score,180,36);
X.font='bold 22px "Trebuchet MS"';X.fillStyle='#ffd23f';X.fillText('🥟 '+g.sam,410,36);X.fillText('🪙 '+g.coin,490,36);X.fillStyle='#fff';X.fillText('📏 '+Math.floor(g.dist)+'m',575,36);X.fillStyle='#ffe9b0';X.fillText('সেরা '+Math.max(best,g.score),705,36);
X.font='18px serif';X.fillText('🧔',14,80);const r=(g.gap-GMIN)/(GMAX-GMIN);bar(40,73,200,14,r,'hsl('+cl(r,0,1)*120+',80%,50%)');
if(r<.3){X.fillStyle='#ff4d6d';X.font='bold 16px "Trebuchet MS"';X.fillText('দোকানদার কাছে!',250,80)}
X.font='18px serif';X.fillStyle='#fff';X.fillText('⚡',16,104);bar(40,98,200,10,g.sta/100,'#4cc9f0');
let px=14;for(const k in g.pw)if(g.pw[k]>0){X.fillStyle='rgba(30,14,4,.62)';X.beginPath();X.roundRect(px,118,44,48,10);X.fill();X.font='22px serif';X.textAlign='center';X.fillStyle='#fff';X.fillText(PW[k].e,px+22,134);bar(px+5,154,34,6,g.pw[k]/PW[k].d,PW[k].c);px+=50;X.textAlign='left'}
if(g.toast){const a=Math.min(1,g.toast.t*2);X.save();X.globalAlpha=a;X.translate(W/2,150);X.scale(1+(1-a)*.2,1+(1-a)*.2);X.font='bold 38px "Chalkboard SE","Comic Sans MS",sans-serif';X.textAlign='center';{const tk=Math.min(1,(W-40)/X.measureText(g.toast.txt).width);X.scale(tk,tk)}X.lineWidth=7;X.strokeStyle='#8a2b00';X.strokeText(g.toast.txt,0,0);X.fillStyle='#ffe066';X.fillText(g.toast.txt,0,0);X.restore()}
X.textBaseline='alphabetic'}

/* ===== UI FLOW ===== */
const ov=n=>document.querySelectorAll('.ov').forEach(e=>e.classList.toggle('on',e.id==n));
function toMenu(){reset();S='menu';paused=false;ov('menu');$('bp').style.display='';$('mb').textContent='🏆 সেরা স্কোর: '+best}
function toStory(){ac();reset();S='story';sIdx=0;sDone=0;ov('story');$('st').textContent=''}
function begin(){ac();reset();S='play';paused=false;ov('');$('bp').style.display='';G.toast={t:1.6,txt:'দৌড় জারিফ দৌড়! 🥟'};say('d','ওওই! আমার সামুচা!');SFX.shout()}
function togglePause(){if(S!='play')return;paused=!paused;ov(paused?'pause':'')}
function toggleMute(){mute=!mute;$('bm').textContent=mute?'🔇':'🔊'}
function jump(){if(S=='play'&&!paused)G.jb=.14}
$('play').onclick=()=>{if(coarse)goFS();toStory()};$('skip').onclick=begin;$('again').onclick=begin;$('home').onclick=toMenu;$('hm').onclick=toMenu;$('res').onclick=togglePause;$('bp').onclick=()=>{togglePause();$('bp').blur()};$('bm').onclick=()=>{toggleMute();$('bm').blur()};
$('story').addEventListener('click',e=>{if(e.target.id=='skip')return;if(sIdx>=SG.length)begin();else sIdx=SG.length});
document.querySelectorAll('.b').forEach(b=>b.addEventListener('click',()=>b.blur()));
/* ===== INPUT ===== */
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();
if(k=='arrowleft'||k=='a')K.l=1;else if(k=='arrowright'||k=='d')K.r=1;else if(k=='arrowdown'||k=='s')K.d=1;else if(k=='shift')K.b=1;
else if((k==' '||k=='arrowup'||k=='w')&&!e.repeat)jump();
else if(k=='p'||k=='escape')togglePause();else if(k=='m')toggleMute();
else if(k=='enter'){if(S=='menu')toStory();else if(S=='over'&&shown)begin();else if(S=='story')begin()}});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k=='arrowleft'||k=='a')K.l=0;else if(k=='arrowright'||k=='d')K.r=0;else if(k=='arrowdown'||k=='s')K.d=0;else if(k=='shift')K.b=0});
document.querySelectorAll('#touch button').forEach(b=>{const k=b.dataset.k;const on=e=>{e.preventDefault();ac();if(k=='j')jump();else K[k]=1};const off=e=>{e.preventDefault();if(k!='j')K[k]=0};
b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,off))});
document.addEventListener('visibilitychange',()=>{if(document.hidden)togglePause()});
/* ===== PHONE SUPPORT: auto-pause in portrait, tap = jump, swipe down = slide, fullscreen ===== */
const rp=matchMedia('(pointer:coarse) and (orientation:portrait)');(rp.addEventListener?rp.addEventListener.bind(rp,'change'):rp.addListener.bind(rp))(e=>{if(e.matches&&S=='play'&&!paused)togglePause()});
if(matchMedia('(pointer:coarse)').matches)document.querySelector('.hint').textContent='বাঁ দিকে ◀ ▶ = চলো · স্ক্রিনে ট্যাপ বা ⤒ = লাফ · নিচে সোয়াইপ বা ⤓ = স্লাইড · ⚡ = দৌড়';
let sw0=null;C.addEventListener('pointerdown',e=>{sw0={y:e.clientY};try{C.setPointerCapture(e.pointerId)}catch(_){}});
C.addEventListener('pointerup',e=>{if(!sw0)return;const dy=e.clientY-sw0.y;sw0=null;if(S!='play'||paused)return;if(dy>35){K.d=1;setTimeout(()=>{K.d=0},380)}else jump()});
C.addEventListener('pointercancel',()=>{sw0=null});
const bf=$('bf'),de=document.documentElement,rF=de.requestFullscreen||de.webkitRequestFullscreen;if(!rF)bf.style.display='none';
const inFS=()=>document.fullscreenElement||document.webkitFullscreenElement;
function goFS(){if(!rF||inFS())return;try{Promise.resolve(rF.call(de)).then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(_){}}).catch(()=>{})}catch(_){}}
bf.onclick=()=>{bf.blur();if(inFS())(document.exitFullscreen||document.webkitExitFullscreen).call(document);else goFS()};
document.addEventListener('contextmenu',e=>e.preventDefault());
/* FIT: fill the whole screen. Wide phones (19.5:9, 20:9...) get a wider street view instead of black bars. */
function fit(){const wr=$('wrap'),vw=wr.clientWidth||innerWidth,vh=wr.clientHeight||innerHeight;
W=Math.round(cl(H*vw/vh,960,1320));const la=W/H,cw=Math.min(vw,vh*la),ch=cw/la;
gEl.style.width=cw+'px';gEl.style.height=ch+'px';gEl.style.setProperty('--u',Math.min(cw/100,ch*1.7778/100)+'px');
DPR=lowQ?1:Math.min(coarse?1.5:2,Math.max(1,window.devicePixelRatio||1));C.width=Math.round(W*DPR);C.height=Math.round(H*DPR);SKY=mkSky()}
fit();addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,300));if(window.visualViewport)visualViewport.addEventListener('resize',fit);
addEventListener('blur',()=>{K.l=K.r=K.d=K.b=0});

/* ===== MAIN LOOP ===== */
function frame(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
if(dt>.03)slowN++;else if(slowN>0)slowN--;if(slowN>120&&!lowQ&&DPR>1){lowQ=1;fit()} // slow phone: drop to 1x resolution
const pl=S=='play'&&!paused;if(gEl.classList.contains('play')!==pl)gEl.classList.toggle('play',pl);
X.setTransform(DPR,0,0,DPR,0,0);
if(!paused){if(S=='play')update(dt);else if(S=='over')updOver(dt);else{updDemo(dt);
if(S=='story'){sIdx=Math.min(SG.length,sIdx+dt*38);const n=sIdx|0;$('st').textContent=SG.slice(0,n).join('');if(n>=SG.length){sDone+=dt;if(sDone>7)begin()}}}}
drawWorld();
if(S=='menu'||S=='story'){X.save();X.translate(0,0);X.restore()}
if(S=='play'||S=='over')hud();
requestAnimationFrame(frame)}
$('mb').textContent='🏆 সেরা স্কোর: '+best;addEventListener('load',()=>{if(document.fonts&&document.fonts.load)Promise.all([document.fonts.load('400 20px "Hind Siliguri"','জারিফ'),document.fonts.load('700 20px "Hind Siliguri"','জারিফ')]).then(()=>{SHOPS=mkShops()}).catch(()=>{})});
requestAnimationFrame(frame);
})();
